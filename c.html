<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منسق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Cairo:wght@400;700&family=Changa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#171B24; --surface:#1F2530; --field:#131720; --line:#2E3646;
  --text:#ECE7DC; --muted:#9AA3B2; --accent:#E8B04B;
  --ok:#7CC6A4; --warn:#E8B04B; --bad:#E07A6A;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.7}
.layout{display:flex;min-height:100vh}
.layout .wrap{flex:1;min-width:0;max-width:780px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(56px + env(safe-area-inset-bottom,0px))}
.side{width:230px;flex:none;border-left:1px solid var(--line);background:var(--surface);padding:28px 18px;position:sticky;top:0;height:100vh}
.stitle{font-size:17px;font-weight:700;margin:0 0 18px;line-height:1.5}
.snav{display:flex;flex-direction:column;gap:6px}
.snav button{background:none;border:0;border-radius:10px;color:var(--muted);padding:10px 12px;font:inherit;text-align:right;cursor:pointer}
.snav button[aria-current=true]{background:var(--field);color:var(--text);border-inline-start:3px solid var(--accent)}
h1{font-size:30px;font-weight:700;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 20px}
.strip{display:flex;height:64px;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:20px}
.strip div{flex:1}
.field label{display:block;color:var(--muted);font-size:14px;margin-bottom:6px}
select,textarea,input[type=text]{background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;width:100%}
textarea{resize:vertical}
.tabs{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.crow{display:grid;grid-template-columns:44px 1fr 40px;gap:10px;align-items:center;margin-bottom:10px}
.crow input[type=color]{width:44px;height:44px;border:0;padding:0;background:none;border-radius:10px;cursor:pointer}
.crow input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.crow input[type=color]::-webkit-color-swatch{border:1px solid var(--line);border-radius:10px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
button.primary{background:var(--accent);color:#171B24;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
button.ghost{background:none;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);min-height:1.5em;margin:10px 0 0;font-size:14px}
.score{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.num{font-size:34px;font-weight:700;width:86px;height:86px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center;flex:none}
.score strong{display:block;font-size:18px}
.score span{color:var(--muted);font-size:14px}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:14px}
.tile{border-radius:10px;padding:12px;min-height:100px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line)}
.tile .aa{font-size:30px;font-weight:700;line-height:1}
.tile small{font-size:12px}
.checks{list-style:none;padding:0;margin:0 0 14px}
.checks li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.checks li:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:9px;flex:none;background:currentColor}
.checks b{display:block;font-weight:600}
.checks span{color:var(--muted);font-size:14px}
.fixes h3,.mood h3{font-size:17px;margin:18px 0 8px;font-weight:700}
.fix{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px;color:var(--muted)}
.fix i{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);flex:none}
.fix code{color:var(--text);direction:ltr;font-size:13px}
.pal{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--surface)}
.pal h4{margin:0 0 10px;font-size:16px;font-weight:600}
.sw{display:flex;height:56px;border-radius:10px;overflow:hidden;margin-bottom:10px;border:1px solid var(--line)}
.sw div{flex:1}
.codes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;font:inherit;font-size:13px;color:var(--text);cursor:pointer;direction:ltr}
.chip i{width:20px;height:20px;border-radius:50%;border:1px solid #0004}
.exs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.exs button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.hint{color:var(--muted);font-size:14px;margin:0 0 14px}
.picker h3{font-size:17px;margin:0 0 12px;font-weight:700}
.psel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.psel button{width:44px;height:44px;border-radius:10px;border:2px solid transparent;cursor:pointer;padding:0}
.psel button[aria-pressed=true]{border-color:var(--text)}
.sv{position:relative;height:200px;border-radius:12px;cursor:crosshair;touch-action:none;border:1px solid var(--line);margin-bottom:16px;overflow:hidden}
.sv::before,.sv::after{content:'';position:absolute;inset:0}
.sv::before{background:linear-gradient(to right,#fff,rgba(255,255,255,0))}
.sv::after{background:linear-gradient(to top,#000,rgba(0,0,0,0))}
.thumb{position:absolute;width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #0008;transform:translate(-50%,-50%);pointer-events:none;z-index:1}
.sl{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin-bottom:12px}
.sl input[type=range]{width:100%;accent-color:var(--accent)}
#hue{-webkit-appearance:none;appearance:none;height:12px;border-radius:6px;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);outline:none}
#hue::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #171B24;box-shadow:0 0 0 1px #fff}
#hue::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #171B24}
.pout{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
#pprev{width:56px;height:56px;border-radius:12px;border:1px solid var(--line)}
#phex{direction:ltr;font-size:17px;font-weight:700}
.pout .btns{margin:0}
.pvv{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.pvv strong{font-size:16px}
.pvv span{color:var(--muted);font-size:14px}
.pvv.ok strong{color:var(--ok)}
.pvv.warn strong{color:var(--warn)}
.pvv.bad strong{color:var(--bad)}
.canvas{border-radius:14px;border:1px solid var(--line);overflow:hidden;transition:background .15s}
.imgband{position:relative;height:130px}
.imgband svg{width:100%;height:100%;display:block}
.imgband .tint{position:absolute;inset:0;opacity:.35}
.txt{padding:22px 24px 26px}
.txt h4{font-size:26px;margin:0 0 10px;font-weight:700}
.txt p{margin:0;font-size:15px;line-height:1.9}
.ctl{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:14px}
.ctl .cl{width:96px;color:var(--muted);font-size:14px}
.ctl input[type=color]{width:40px;height:40px;border:0;padding:0;background:none;border-radius:10px;cursor:pointer}
.ctl input[type=text]{width:120px;direction:ltr}
.ctl .chips{display:flex;gap:6px;flex-wrap:wrap;width:100%;padding-inline-start:106px}
.fonts-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#171B24;padding:8px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;font-weight:600}
#toast.show{opacity:1}
@media (max-width:760px){
  .layout{display:block}
  .side{position:static;width:auto;height:auto;border-left:0;border-bottom:1px solid var(--line);padding:16px}
  .stitle{margin-bottom:10px}
  .snav{flex-direction:row;overflow-x:auto}
  .snav button{white-space:nowrap}
  .fonts-row{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){#toast,.canvas{transition:none}}
</style>
</head>
<body>
<div class="layout">
<aside class="side">
  <h2 class="stitle">تنسيق الألوان والخطوط</h2>
  <nav class="snav" aria-label="أقسام الأداة">
    <button data-panel="p1" aria-current="true">قيّم اللوحة</button>
    <button data-panel="p3" aria-current="false">المعاينة والخطوط</button>
    <button data-panel="p2" aria-current="false">اقتراح الألوان</button>
  </nav>
</aside>
<div class="wrap">
  <header>
    <h1>منسق</h1>
    <p class="sub">اختر لوناً وعدّل درجته، وقيّم لوحتك لمشروعك، أو اطلب لوحات مقترحة من وصف مشروعك.</p>
  </header>

  <div class="strip" id="strip" aria-hidden="true"></div>

  <div class="field" style="margin-bottom:16px">
    <label for="proj">نوع المشروع</label>
    <select id="proj"></select>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" id="t1" aria-selected="true" aria-controls="p1" data-tab="p1">قيّم ألواني</button>
    <button role="tab" id="t2" aria-selected="false" aria-controls="p2" data-tab="p2" tabindex="-1">اقترح ألواناً</button>
  </div>

  <section id="p1" role="tabpanel" aria-labelledby="t1">
    <div class="card">
      <div id="inputs"></div>
      <div class="btns">
        <button class="ghost" id="add">أضف لوناً</button>
        <button class="primary" id="evalBtn">قيّم اللوحة</button>
      </div>
      <p class="err" id="err" role="alert"></p>
    </div>

    <div class="card picker" id="picker">
      <h3>أداة اختيار اللون</h3>
      <div class="psel" id="psel"></div>
      <div class="sv" id="sv"><div class="thumb" id="thumb"></div></div>
      <label class="sl">الدرجة اللونية <input type="range" id="hue" min="0" max="360" step="1"></label>
      <label class="sl">التشبع <input type="range" id="sat" min="0" max="100" step="1"></label>
      <label class="sl">السطوع <input type="range" id="val" min="0" max="100" step="1"></label>
      <div class="pout">
        <div id="pprev"></div>
        <code id="phex"></code>
        <div class="btns">
          <button class="ghost" id="lighter">فتّح</button>
          <button class="ghost" id="darker">غمّق</button>
          <button class="ghost" id="copyHex">انسخ</button>
        </div>
      </div>
    </div>

    <div id="result"></div>
  </section>

  <section id="p2" role="tabpanel" aria-labelledby="t2" hidden>
    <div class="card">
      <label for="desc" style="display:block;margin-bottom:8px">صف مشروعك</label>
      <textarea id="desc" rows="3" placeholder="مثال: متجر قهوة مختص بالحبوب المحمصة محلياً، أريد إحساساً دافئاً وأصيلاً"></textarea>
      <div class="exs" id="exs"></div>
      <div class="btns"><button class="primary" id="sugBtn">اقترح لوحات</button></div>
    </div>
    <div id="sugOut"></div>
  </section>

  <section id="p3" role="tabpanel" hidden>
    <div class="card">
      <h3 style="font-size:17px;margin:0 0 6px;font-weight:700">معاينة التصميم</h3>
      <p class="hint">عدّل لون الخلفية والعنوان والفقرة كلاً على حدة، وشاهد التباين مباشرة. الألوان المقترحة من لوحتك تظهر تحت كل حقل.</p>
      <div class="canvas" id="canvas"></div>
      <div id="pvVerdict"></div>
    </div>
    <div class="card">
      <div id="ctrls"></div>
      <div class="fonts-row">
        <div class="field"><label for="hFont">خط العنوان</label><select id="hFont"></select></div>
        <div class="field"><label for="bFont">خط الفقرة</label><select id="bFont"></select></div>
      </div>
      <div class="btns"><button class="ghost" id="resetPv">استخدم ألوان اللوحة</button></div>
    </div>
  </section>
</div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s);

/* ---------- بيانات ---------- */
const PROJECTS = {
  "": {label:"بدون تحديد", mood:null, sat:null},
  logo: {label:"شعار", mood:"default", sat:[30,85]},
  website: {label:"موقع أو تطبيق", mood:"tech", sat:[20,80]},
  restaurant: {label:"مطعم أو مقهى", mood:"food", sat:[40,85]},
  luxury: {label:"منتج فاخر", mood:"luxury", sat:[0,45]},
  kids: {label:"منتجات أطفال", mood:"kids", sat:[60,100]},
  health: {label:"صحة أو عيادة", mood:"health", sat:[25,70]},
  finance: {label:"شركة أو خدمات مالية", mood:"finance", sat:[10,60]},
  nature: {label:"بيئي أو زراعي", mood:"nature", sat:[25,70]},
  sport: {label:"رياضة", mood:"sport", sat:[60,100]},
  ad: {label:"إعلان أو بوستر", mood:"default", sat:[30,95]}
};

const MOODS = {
  nature: {label:"الطبيعة والاستدامة", words:["طبيع","بيئ","عضو","زراع","مزرع","نبات","اخضر","استدام"], palettes:[
    {name:"غابة هادئة", colors:["#2F4A3A","#7A9A6B","#D8CBA6","#F3EEDF","#B5673E"]},
    {name:"تراب وخزف", colors:["#3B3024","#A3793F","#E3D2B0","#F6F0E3","#5F7F5A"]}]},
  tech: {label:"التقنية والحداثة", words:["تقن","تكنولوج","برمج","تطبيق","ذكاء","رقمي","سوفت","حديث","منصه","سحاب"], palettes:[
    {name:"أزرق ليلي", colors:["#0B1F3A","#1C6DD0","#34D1BF","#E8F1FF","#0F172A"]},
    {name:"رمادي معدني", colors:["#15171C","#6366F1","#A5B4FC","#F3F4F6","#22D3EE"]}]},
  luxury: {label:"الفخامة والأناقة", words:["فخم","فاخر","راقي","ذهب","لوكس","مجوهر","عطر","حصري","ملكي"], palettes:[
    {name:"أسود وذهب", colors:["#0E0E0E","#C9A54C","#F3ECDD","#4A1F2A","#8C6B3A"]},
    {name:"بورغندي وشمبانيا", colors:["#1C1B22","#B8975A","#E9DFCB","#5B2333","#6E6E73"]}]},
  kids: {label:"الأطفال والمرح", words:["طفل","اطفال","مرح","العاب","طفولي","تعليم","حضان","روضه"], palettes:[
    {name:"ألوان الروضة", colors:["#FF5C7A","#FFC93C","#3ECF8E","#4D7CFE","#FFF7E6"]},
    {name:"ربيعي فرِح", colors:["#FF7A59","#FFD23F","#2EC4B6","#7B61FF","#FFFBF0"]}]},
  food: {label:"الطعام والضيافة", words:["مطعم","طعام","اكل","قهوه","مقهى","حلويات","مخبز","بيتزا","وجبات","ضياف"], palettes:[
    {name:"دفء إيطالي", colors:["#B83227","#F2A541","#FBF3E4","#3B2A22","#6B8E23"]},
    {name:"قهوة وخبز", colors:["#7A2E1F","#E07A3F","#F6E7CF","#2E2118","#8DA65A"]}]},
  health: {label:"الصحة والطمأنينة", words:["صحه","طب","عياد","مستشف","دواء","علاج","رعاي","اسنان"], palettes:[
    {name:"تيل هادئ", colors:["#0F766E","#5EC4B8","#E6F5F3","#1E3A5F","#9BD3E0"]},
    {name:"أزرق ناعم", colors:["#2A7F8F","#A7DCD6","#F2FAF9","#22415C","#D7EEF2"]}]},
  finance: {label:"المال والثقة", words:["بنك","مال","استثمار","محام","قانون","شركه","مؤسس","تامين","اعمال"], palettes:[
    {name:"كحلي مؤسسي", colors:["#0A2540","#1F4E79","#C5CED8","#F5F7FA","#B8860B"]},
    {name:"أزرق وفضي", colors:["#14213D","#3A5A80","#E5E5E5","#FCA311","#F8F9FA"]}]},
  sport: {label:"الرياضة والقوة", words:["رياض","نادي","قوه","جريء","لياقه","جيم","طاقه"], palettes:[
    {name:"أسود وأحمر", colors:["#0A0A0A","#E63946","#F1FAEE","#1D3557","#A8DADC"]},
    {name:"برتقالي ليلي", colors:["#111111","#FF4D00","#F5F5F5","#2B2D42","#FFB703"]}]},
  default: {label:"حيادي وعملي", words:[], palettes:[
    {name:"أساسي متوازن", colors:["#1B1F2A","#E8B04B","#ECE7DC","#6C7A89","#3E8E7E"]},
    {name:"هادئ ومرن", colors:["#24323F","#D9826B","#F4F1EA","#8FA9B8","#5E8C7A"]}]}
};

const EXAMPLES = ["تطبيق تقني لإدارة المحافظ المالية","عيادة أسنان للأطفال","علامة عطور فاخرة","مزرعة عضوية تبيع الخضار","مطعم شاورما شبابي"];
const FONTS = ['Cairo','Tajawal','IBM Plex Sans Arabic','Almarai','Noto Kufi Arabic','Changa'];

/* ---------- الحالة ---------- */
const state = { colors:["#1B1F2A","#E8B04B","#ECE7DC"], project:"" };
const pk = {sel:0, h:0, s:0, v:0};
const pvc = {bg:'#FFFFFF', hc:'#000000', pc:'#333333', tint:'#000000'};
const ft = {h:'Cairo', b:'Tajawal'};

/* ---------- أدوات الألوان ---------- */
const norm = s => s.toLowerCase().replace(/[\u064B-\u065F]/g,"").replace(/[إأآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي");

function normHex(s){
  s = (s||"").trim().replace(/^#?/,"#");
  if(/^#[0-9a-f]{3}$/i.test(s)) s = "#" + s.slice(1).split("").map(c=>c+c).join("");
  return /^#[0-9a-f]{6}$/i.test(s) ? s.toUpperCase() : null;
}
const hexRgb = h => { const n = parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; };
const rgbHex = (r,g,b) => "#" + [r,g,b].map(v=>Math.round(Math.min(255,Math.max(0,v))).toString(16).padStart(2,"0")).join("").toUpperCase();

function rgbHsl([r,g,b]){
  r/=255; g/=255; b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h=0, s=0, l=(mx+mn)/2;
  if(d){
    s = l>0.5 ? d/(2-mx-mn) : d/(mx+mn);
    if(mx===r) h=((g-b)/d+(g<b?6:0));
    else if(mx===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60;
  }
  return [h, s*100, l*100];
}
function hslRgb(h,s,l){
  h=((h%360)+360)%360; s=Math.min(100,Math.max(0,s))/100; l=Math.min(100,Math.max(0,l))/100;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  const [r,g,b] = h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
  return [(r+m)*255,(g+m)*255,(b+m)*255];
}
const hslHex = (h,s,l) => rgbHex(...hslRgb(h,s,l));
const lum = hex => hexRgb(hex).map(c=>{c/=255; return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);}).reduce((a,c,i)=>a+c*[0.2126,0.7152,0.0722][i],0);
const contrast = (a,b) => { const x=lum(a), y=lum(b); return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05); };
const dist = (a,b) => { const A=hexRgb(a), B=hexRgb(b); return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2]); };
const hueDiff = (a,b) => { const d=Math.abs(a-b)%360; return d>180?360-d:d; };
const contrastBest = (ref, cands) => cands.reduce((best,c)=> contrast(c,ref)>contrast(best,ref)?c:best, cands[0]);

// يعدّل سطوع اللون في الاتجاه المطلوب حتى يبلغ التباين الهدف
function adjust(hex, bg, dir, target=4.5){
  let [h,s,l] = rgbHsl(hexRgb(hex));
  for(let k=0;k<=100;k++){
    const c = hslHex(h,s,l);
    if(contrast(c,bg)>=target) return {hex:c, ok:true};
    l += dir;
    if(l<0||l>100) break;
  }
  return {hex:hslHex(h,s,Math.min(100,Math.max(0,l))), ok:false};
}
const verdictFor = r => r>=4.5 ? {c:'ok',t:'مقروء بوضوح'} : r>=3 ? {c:'warn',t:'مقبول للعناوين الكبيرة فقط'} : {c:'bad',t:'غير مقروء'};
const verdictHtml = (v,detail,extra) => `<div class="pvv ${v.c}"><strong>${v.t}</strong><span>${detail}</span>${extra?`<span>${extra}</span>`:''}</div>`;

/* ---------- التقييم ---------- */
function evaluate(cols, project){
  const checks=[], fixes=[]; let penalty=0;
  const n=cols.length;
  const info = cols.map((c,i)=>{ const [h,s,l]=rgbHsl(hexRgb(c)); return {i,c,h,s,l}; });

  if(n<3){ penalty+=10; checks.push({s:"warn",t:"عدد الألوان قليل",d:`لديك ${n} ألوان فقط. لوحة من 3 إلى 5 ألوان تمنحك مرونة كافية.`}); }
  else if(n>5){ penalty+=10; checks.push({s:"warn",t:"عدد الألوان كبير",d:`${n} ألوان قد تشتّت المتلقي. اختر لوناً أساسياً وآخر للتمييز وخفّف الباقي.`}); }
  else checks.push({s:"ok",t:"عدد الألوان مناسب",d:`${n} ألوان ضمن النطاق المثالي.`});

  let dup=0;
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
    if(dist(cols[i],cols[j])<45){
      dup++;
      if(dup<=2){
        penalty+=10;
        checks.push({s:"warn",t:"لونان متشابهان جداً",d:`${cols[i]} و${cols[j]} متقاربان، ولن يظهر الفرق بينهما في التصميم. الأفضل حذف أحدهما.`});
        fixes.push({i:j,type:"remove",reason:`يشبه ${cols[i]}`});
      }
    }
  }

  if(n>=2){
    const sorted=[...cols].sort((a,b)=>lum(b)-lum(a));
    const light=sorted[0], dark=sorted[sorted.length-1];
    const cr=contrast(light,dark);
    if(light!==dark && cr<4.5){
      penalty+=20;
      checks.push({s:"bad",t:"التباين ضعيف للنصوص",d:`أعلى تباين بين ${light} و${dark} هو ${cr.toFixed(1)}:1، والمطلوب 4.5:1 على الأقل لقراءة النص.`});
      const a=adjust(light,dark,+1);
      if(a.ok) fixes.push({i:cols.indexOf(light),type:"replace",to:a.hex,reason:"فتّحت اللون ليصل التباين إلى 4.5:1"});
      else {
        const b=adjust(dark,light,-1);
        if(b.ok) fixes.push({i:cols.indexOf(dark),type:"replace",to:b.hex,reason:"غمّقت اللون ليصل التباين إلى 4.5:1"});
      }
    } else checks.push({s:"ok",t:"التباين كافٍ للنصوص",d:`أعلى تباين بين الألوان هو ${cr.toFixed(1)}:1.`});
  }

  const vivid = info.filter(x=>x.s>=80 && x.l>=25 && x.l<=75);
  if(vivid.length>2){
    penalty+=10;
    checks.push({s:"warn",t:"ألوان صارخة كثيرة",d:`${vivid.length} ألوان بتشبع عالٍ. عادةً لون صارخ واحد يكفي، والبقية تُخفَّف لتمنح العين راحة.`});
    vivid.slice(1).forEach(x=>fixes.push({i:x.i,type:"replace",to:hslHex(x.h,55,x.l),reason:"خفّفت التشبع"}));
  }

  const chrom = info.filter(x=>x.s>=15 && x.l>8 && x.l<95);
  if(chrom.length>=2){
    const diffs=[];
    for(let a=0;a<chrom.length;a++) for(let b=a+1;b<chrom.length;b++) diffs.push(hueDiff(chrom[a].h,chrom[b].h));
    const close = diffs.every(d=>d<=45);
    const comp = diffs.some(d=>d>=160 && d<=200);
    const tri = diffs.some(d=>d>=100 && d<=140);
    if(close) checks.push({s:"ok",t:"التناغم اللوني جيد",d:"الألوان المشبعة متقاربة في الدرجة، وهذا يعطي هوية هادئة ومتماسكة."});
    else if(comp||tri) checks.push({s:"ok",t:"تناغم تكميلي أو ثلاثي",d:"الألوان مبنية على علاقة لونية معروفة، وهذا يعطي تبايناً مقصوداً."});
    else {
      penalty+=10;
      checks.push({s:"bad",t:"الأصباغ متنافرة",d:"الألوان المشبعة لا تنتمي إلى علاقة لونية واضحة، فتبدو اللوحة عشوائية. اقتربت الألوان البعيدة من اللون الأكثر تشبعاً."});
      const anchor=[...chrom].sort((a,b)=>b.s-a.s)[0];
      chrom.forEach(x=>{
        if(x.i===anchor.i) return;
        if(hueDiff(x.h,anchor.h)>60){
          const d=((x.h-anchor.h+540)%360)-180;
          fixes.push({i:x.i,type:"replace",to:hslHex(anchor.h+Math.sign(d)*30,x.s,x.l),reason:"قرّبت درجة اللون من اللون الأساسي"});
        }
      });
    }
  }

  if(n>=3){
    const Ls=info.map(x=>x.l), range=Math.max(...Ls)-Math.min(...Ls);
    if(range<30){ penalty+=5; checks.push({s:"warn",t:"الإضاءة متقاربة",d:"كل الألوان تقريباً بنفس السطوع، فيصعب بناء تسلسل بصري. أضف لوناً فاتحاً جداً أو داكناً جداً."}); }
    else checks.push({s:"ok",t:"تدرج جيد في السطوع",d:"وجود درجات فاتحة وداكنة يصنع تسلسلاً واضحاً للعين."});
  }

  const P=PROJECTS[project];
  if(P && P.sat && chrom.length){
    const avg=chrom.reduce((a,x)=>a+x.s,0)/chrom.length;
    const [lo,hi]=P.sat;
    if(avg<lo||avg>hi){
      penalty+=10;
      const target = avg<lo ? lo : hi;
      checks.push({s:"bad",t:`غير مناسبة لمشروع: ${P.label}`,d:`متوسط التشبع ${Math.round(avg)}٪، ويناسب هذا النوع من المشاريع بين ${lo}٪ و${hi}٪.`});
      chrom.forEach(x=>{
        const ns=Math.min(100,Math.max(0,x.s+(target-avg)));
        fixes.push({i:x.i,type:"replace",to:hslHex(x.h,ns,x.l),reason:"عدّلت التشبع ليناسب نوع المشروع"});
      });
    } else checks.push({s:"ok",t:`تناسب ${P.label}`,d:`متوسط التشبع ${Math.round(avg)}٪ ضمن المدى المناسب لهذا النوع.`});
  }

  return {score:Math.max(0,100-penalty), checks, fixes};
}

/* ---------- العرض العام ---------- */
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1600);
}
function copy(text){
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(()=>toast("تم نسخ "+text)).catch(()=>toast(text));
  else toast(text);
}

function renderStrip(){
  $("#strip").innerHTML = state.colors.map(c=>`<div style="background:${c}"></div>`).join("");
  pkSync();
}

function renderInputs(){
  const box=$("#inputs"); box.innerHTML="";
  state.colors.forEach((c,i)=>{
    const row=document.createElement("div");
    row.className="crow";
    row.innerHTML=`<input type="color" value="${c.toLowerCase()}" aria-label="لون ${i+1}">
      <input type="text" value="${c}" dir="ltr" maxlength="7" aria-label="كود اللون ${i+1}">
      <button class="ghost" aria-label="احذف اللون ${i+1}" ${state.colors.length<=2?"disabled":""}>✕</button>`;
    const [picker,text,del]=row.children;
    picker.addEventListener("input",()=>{ state.colors[i]=picker.value.toUpperCase(); text.value=state.colors[i]; renderStrip(); });
    text.addEventListener("input",()=>{
      const v=normHex(text.value);
      if(v){ state.colors[i]=v; picker.value=v.toLowerCase(); renderStrip(); $("#err").textContent=""; }
    });
    text.addEventListener("blur",()=>{ text.value=state.colors[i]; });
    del.addEventListener("click",()=>{ state.colors.splice(i,1); renderInputs(); runEval(); });
    row.addEventListener("click",e=>{ if(e.target.tagName==="BUTTON") return; pk.sel=i; pkLoad(); pkRender(); });
    box.appendChild(row);
  });
  $("#add").disabled = state.colors.length>=6;
}

function renderResult(r){
  const cls = r.score>=75?"ok":r.score>=50?"warn":"bad";
  const verdict = r.score>=75?"مناسبة لمشروعك":r.score>=50?"مناسبة بعد بعض التعديلات":"غير مناسبة في وضعها الحالي";
  const tiles = state.colors.map(c=>{
    const w=contrast(c,"#FFFFFF"), b=contrast(c,"#000000");
    const tc = w>=b?"#FFFFFF":"#000000";
    return `<div class="tile" style="background:${c};color:${tc}"><span class="aa">أ</span><small dir="ltr">${c}</small><small>${Math.max(w,b).toFixed(1)}:1</small></div>`;
  }).join("");

  const checks = r.checks.map(c=>`<li class="${c.s}"><span class="dot"></span><div><b>${esc(c.t)}</b><span>${esc(c.d)}</span></div></li>`).join("");

  const fixesHtml = r.fixes.length ? (()=>{
    const items = r.fixes.map(f=>{
      const before = state.colors[f.i];
      if(f.type==="remove") return `<div class="fix"><i style="background:${before}"></i><span>احذف <code>${before}</code>، ${esc(f.reason)}</span></div>`;
      return `<div class="fix"><i style="background:${before}"></i><code>${before}</code><span>←</span><i style="background:${f.to}"></i><code>${f.to}</code><span>${esc(f.reason)}</span></div>`;
    }).join("");
    return `<div class="fixes"><h3>التصحيحات المقترحة</h3>${items}<div class="btns"><button class="primary" id="applyFix">طبّق التصحيحات</button></div></div>`;
  })() : `<div class="fixes"><h3>لا تصحيحات مطلوبة</h3><span style="color:var(--muted)">لوحتك سليمة بالمعايير التي فحصناها.</span></div>`;

  $("#result").innerHTML = `
    <div class="card">
      <div class="score ${cls}"><div class="num">${r.score}</div><div><strong>${verdict}</strong><span>التقييم من 100 بناءً على التباين والتناغم والتشبع وملاءمة المشروع</span></div></div>
      <h3 style="font-size:17px;margin:0 0 10px">اختبار القراءة</h3>
      <div class="tiles">${tiles}</div>
      <h3 style="font-size:17px;margin:0 0 4px">الفحوص</h3>
      <ul class="checks">${checks}</ul>
      ${fixesHtml}
    </div>`;

  const ap=$("#applyFix");
  if(ap) ap.addEventListener("click",()=>applyFixes(r.fixes));
}

function applyFixes(fixes){
  const remove=new Set(fixes.filter(f=>f.type==="remove").map(f=>f.i));
  const rep={};
  fixes.filter(f=>f.type==="replace").forEach(f=>rep[f.i]=f.to);
  state.colors=state.colors.map((c,i)=>rep[i]||c).filter((_,i)=>!remove.has(i));
  if(state.colors.length<2) state.colors.push("#CCCCCC");
  renderInputs(); runEval(); toast("تم تطبيق التصحيحات");
}

function runEval(){
  renderStrip();
  renderResult(evaluate(state.colors, state.project));
}

/* ---------- أداة اختيار اللون ---------- */
function hsvToHex(h,s,v){
  const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
  const [r,g,b] = h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
  return rgbHex((r+m)*255,(g+m)*255,(b+m)*255);
}
function hexToHsv(hex){
  const [r,g,b]=hexRgb(hex).map(v=>v/255);
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h=0;
  if(d){
    if(mx===r) h=((g-b)/d)%6;
    else if(mx===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60; if(h<0) h+=360;
  }
  return [h, mx?d/mx:0, mx];
}
function pkLoad(){ [pk.h,pk.s,pk.v]=hexToHsv(state.colors[pk.sel]); }
function pkRender(){
  const hex=hsvToHex(pk.h,pk.s,pk.v);
  $("#sv").style.background=`hsl(${pk.h},100%,50%)`;
  const t=$("#thumb");
  t.style.left=(pk.s*100)+"%";
  t.style.top=((1-pk.v)*100)+"%";
  t.style.background=hex;
  $("#hue").value=Math.round(pk.h);
  $("#sat").value=Math.round(pk.s*100);
  $("#val").value=Math.round(pk.v*100);
  $("#pprev").style.background=hex;
  $("#phex").textContent=hex;
  $("#psel").innerHTML=state.colors.map((c,i)=>`<button aria-pressed="${i===pk.sel}" aria-label="اختر اللون ${c}" data-i="${i}" style="background:${c}"></button>`).join("");
}
// يلتقط أي تغيير خارجي للألوان ويحدّث الأداة والمعاينة
function pkSync(){
  if(pk.sel>=state.colors.length) pk.sel=0;
  if(hsvToHex(pk.h,pk.s,pk.v)!==state.colors[pk.sel]) pkLoad();
  pkRender();
  renderPreview();
}
// يحفظ تغييرات السحب؛ الكامل يعيد بناء القوائم والتقييم
function pkSet(full){
  state.colors[pk.sel]=hsvToHex(pk.h,pk.s,pk.v);
  renderStrip(); pkRender();
  if(full){ renderInputs(); renderResult(evaluate(state.colors,state.project)); }
}
function pkSetup(){
  const sv=$("#sv");
  const pick=e=>{
    const r=sv.getBoundingClientRect();
    pk.s=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
    pk.v=Math.min(1,Math.max(0,1-(e.clientY-r.top)/r.height));
    pkSet(false);
  };
  sv.addEventListener("pointerdown",e=>{ sv.setPointerCapture(e.pointerId); pick(e); });
  sv.addEventListener("pointermove",e=>{ if(sv.hasPointerCapture(e.pointerId)) pick(e); });
  sv.addEventListener("pointerup",()=>pkSet(true));
  sv.addEventListener("pointercancel",()=>pkSet(true));
  $("#hue").addEventListener("input",e=>{ pk.h=+e.target.value; pkSet(false); });
  $("#sat").addEventListener("input",e=>{ pk.s=e.target.value/100; pkSet(false); });
  $("#val").addEventListener("input",e=>{ pk.v=e.target.value/100; pkSet(false); });
  ["#hue","#sat","#val"].forEach(id=>$(id).addEventListener("change",()=>pkSet(true)));
  $("#lighter").addEventListener("click",()=>{ pk.v=Math.min(1,pk.v+0.08); pkSet(true); });
  $("#darker").addEventListener("click",()=>{ pk.v=Math.max(0,pk.v-0.08); pkSet(true); });
  $("#copyHex").addEventListener("click",()=>copy(state.colors[pk.sel]));
  $("#psel").addEventListener("click",e=>{
    const b=e.target.closest("[data-i]"); if(!b) return;
    pk.sel=+b.dataset.i; pkLoad(); pkRender();
  });
}

/* ---------- المعاينة والخطوط ---------- */
const CTRL=[['bg','لون الخلفية'],['hc','لون العنوان'],['pc','لون الفقرة'],['tint','طبقة الصورة']];

function buildCtrls(){
  $("#ctrls").innerHTML = CTRL.map(([k,l])=>`
    <div class="ctl">
      <span class="cl">${l}</span>
      <input type="color" data-k="${k}" aria-label="${l}">
      <input type="text" data-k="${k}" dir="ltr" maxlength="7" aria-label="كود ${l}">
      <div class="chips" data-chips="${k}"></div>
    </div>`).join("");
}

let chipKey='';
function renderPreview(){
  if(!$("#canvas")) return;
  const key=state.colors.join("|");
  if(key!==chipKey){
    chipKey=key;
    document.querySelectorAll("[data-chips]").forEach(el=>{
      el.innerHTML=state.colors.map(c=>`<button class="chip" data-k="${el.dataset.chips}" data-v="${c}"><i style="background:${c}"></i>${c}</button>`).join("");
    });
  }
  renderCanvas();
}

function textCheck(label,key){
  const fg=pvc[key], bg=pvc.bg;
  const r=contrast(fg,bg), v=verdictFor(r);
  const fx = r<4.5 ? adjust(fg, bg, lum(bg)>lum(fg)?-1:1) : null;
  const fixBtn = (fx&&fx.ok) ? `<div class="btns"><button class="ghost" data-fix="${key}" data-to="${fx.hex}">طبّق اللون المقترح ${fx.hex}</button></div>` : '';
  return `<div class="pvv ${v.c}"><strong>${label}: ${v.t}</strong><span>نسبة التباين ${r.toFixed(1)}:1 بين ${fg} والخلفية ${bg}</span>${fixBtn}</div>`;
}

function renderCanvas(){
  const {bg,hc,pc,tint}=pvc;
  const hf=`${ft.h}, sans-serif`, bf=`${ft.b}, sans-serif`;
  const p=state.colors, n=p.length;
  const svg=`<svg viewBox='0 0 400 130' preserveAspectRatio='xMidYMid slice' aria-hidden='true'>
      <defs><linearGradient id='pvg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${p[0]}'/><stop offset='1' stop-color='${p[n-1]}'/></linearGradient></defs>
      <rect width='400' height='130' fill='url(#pvg)'/>
      <circle cx='300' cy='50' r='40' fill='${p[1%n]}' opacity='.9'/>
      <path d='M0 110 Q110 70 220 105 T400 95 V130 H0Z' fill='${p[2%n]}'/>
      <rect x='36' y='24' width='96' height='48' rx='10' fill='${p[n-1]}' opacity='.75'/>
    </svg>`;
  const cv=$("#canvas");
  cv.style.background=bg;
  cv.innerHTML=`<div class="imgband">${svg}<div class="tint" style="background:${tint}"></div></div>
    <div class="txt">
      <h4 style="color:${hc};font-family:${hf}">عنوان تجريبي للمشروع</h4>
      <p style="color:${pc};font-family:${bf}">نص تجريبي يوضح كيف يظهر لون الفقرة على الخلفية المختارة. القراءة المريحة للنصوص الطويلة تعتمد على التباين الكافي بين اللون والخلفية.</p>
    </div>`;
  $("#pvVerdict").innerHTML = textCheck("العنوان","hc") + textCheck("الفقرة","pc");
  syncCtrls();
}

function syncCtrls(){
  Object.keys(pvc).forEach(k=>{
    const col=document.querySelector(`#ctrls input[type=color][data-k='${k}']`);
    const txt=document.querySelector(`#ctrls input[type=text][data-k='${k}']`);
    if(col) col.value=pvc[k].toLowerCase();
    if(txt && document.activeElement!==txt) txt.value=pvc[k];
  });
}

function resetPv(){
  const cols=state.colors;
  pvc.bg=[...cols].sort((a,b)=>lum(b)-lum(a))[0];
  const cands=[...cols,'#000000','#FFFFFF'].filter(c=>c!==pvc.bg);
  pvc.hc=contrastBest(pvc.bg,cands);
  pvc.pc=contrastBest(pvc.bg,cands.filter(c=>c!==pvc.hc));
  pvc.tint=cols[cols.length-1];
  renderPreview();
}

function previewSetup(){
  buildCtrls();
  const opts=FONTS.map(f=>`<option>${f}</option>`).join('');
  $("#hFont").innerHTML=opts; $("#bFont").innerHTML=opts;
  $("#hFont").value=ft.h; $("#bFont").value=ft.b;
  $("#hFont").addEventListener("change",e=>{ ft.h=e.target.value; renderCanvas(); });
  $("#bFont").addEventListener("change",e=>{ ft.b=e.target.value; renderCanvas(); });

  $("#ctrls").addEventListener("input",e=>{
    const k=e.target.dataset.k; if(!k) return;
    if(e.target.type==="color") pvc[k]=e.target.value.toUpperCase();
    else { const v=normHex(e.target.value); if(!v) return; pvc[k]=v; }
    renderCanvas();
  });
  $("#ctrls").addEventListener("change",e=>{
    const k=e.target.dataset.k;
    if(k && e.target.type==="text") e.target.value=pvc[k];
  });
  $("#ctrls").addEventListener("click",e=>{
    const c=e.target.closest(".chip"); if(!c) return;
    pvc[c.dataset.k]=c.dataset.v; renderCanvas();
  });
  $("#pvVerdict").addEventListener("click",e=>{
    const b=e.target.closest("[data-fix]"); if(!b) return;
    pvc[b.dataset.fix]=b.dataset.to; renderCanvas();
  });
  $("#resetPv").addEventListener("click",resetPv);
  resetPv();
}

/* ---------- الاقتراحات ---------- */
function suggest(){
  const pid=$("#proj").value;
  const text = norm($("#desc").value + (pid?" "+PROJECTS[pid].label:""));
  const out=$("#sugOut");
  if(!text.trim()){ out.innerHTML=`<div class="card"><span style="color:var(--muted)">اكتب وصفاً لمشروعك أو اختر نوعه أولاً.</span></div>`; return; }

  let scored = Object.keys(MOODS).filter(k=>k!=="default").map(k=>({
    k, s: MOODS[k].words.reduce((a,w)=>a+(text.includes(norm(w))?1:0),0)
  }));
  const pm = PROJECTS[pid].mood;
  if(pm) scored.forEach(x=>{ if(x.k===pm) x.s+=3; });
  let top = scored.filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,2).map(x=>x.k);
  if(!top.length) top=["default"];

  out.innerHTML = top.map(k=>`
    <div class="mood"><h3>${MOODS[k].label}</h3>
    ${MOODS[k].palettes.map((p,pi)=>`
      <div class="pal">
        <h4>${esc(p.name)}</h4>
        <div class="sw">${p.colors.map(c=>`<div style="background:${c}"></div>`).join("")}</div>
        <div class="codes">${p.colors.map(c=>`<button class="chip" data-copy="${c}"><i style="background:${c}"></i>${c}</button>`).join("")}</div>
        <button class="ghost" data-use="${k}|${pi}">قيّم هذه اللوحة</button>
      </div>`).join("")}
    </div>`).join("");
}

/* ---------- التهيئة ---------- */
function switchTab(id){
  document.querySelectorAll('[role="tab"]').forEach(b=>{
    const on=b.dataset.tab===id;
    b.setAttribute("aria-selected",on); b.tabIndex=on?0:-1;
  });
  ["p1","p2","p3"].forEach(p=>{ const el=$("#"+p); if(el) el.hidden = p!==id; });
  document.querySelectorAll(".snav [data-panel]").forEach(b=>b.setAttribute("aria-current", String(b.dataset.panel===id)));
  window.scrollTo({top:0});
}

function init(){
  $("#proj").innerHTML = Object.keys(PROJECTS).map(k=>`<option value="${k}">${PROJECTS[k].label}</option>`).join("");
  $("#proj").addEventListener("change",e=>{ state.project=e.target.value; runEval(); });

  $("#exs").innerHTML = EXAMPLES.map(e=>`<button>${e}</button>`).join("");
  $("#exs").addEventListener("click",e=>{ if(e.target.tagName==="BUTTON"){ $("#desc").value=e.target.textContent; suggest(); } });

  $("#add").addEventListener("click",()=>{ if(state.colors.length<6){ state.colors.push("#808080"); renderInputs(); runEval(); } });
  $("#evalBtn").addEventListener("click",()=>{
    const bad = state.colors.some(c=>!normHex(c));
    $("#err").textContent = bad ? "بعض الأكواد غير صحيحة. استخدم صيغة مثل #1A2B3C." : "";
    if(!bad) runEval();
  });

  document.querySelectorAll('[role="tab"]').forEach(btn=>btn.addEventListener("click",()=>switchTab(btn.dataset.tab)));
  document.querySelectorAll(".snav [data-panel]").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.panel)));
  $("#sugBtn").addEventListener("click",suggest);

  $("#sugOut").addEventListener("click",e=>{
    const cp=e.target.closest("[data-copy]");
    if(cp) return copy(cp.dataset.copy);
    const use=e.target.closest("[data-use]");
    if(use){
      const [k,pi]=use.dataset.use.split("|");
      state.colors = MOODS[k].palettes[+pi].colors.slice();
      renderInputs(); switchTab("p1"); runEval();
    }
  });

  pkSetup();
  previewSetup();
  renderInputs(); runEval();
}

init();
</script>
</body>
</html>
